.footer-title { font: 31px Georgia, 'Times New Roman', serif; fill: #172B45; }
.footer-note { font: 17px Arial, Helvetica, sans-serif; fill: #52647A; }
</style></defs><rect width="1600" height="900" fill="#F5F2EA"/><text x="60" y="48" text-anchor="start" class="kicker">LLM SECURITY  /  SYSTEM MAP</text><text x="60" y="105" text-anchor="start" class="title">Guardrails &amp; Controlled Replay</text><text x="60" y="143" text-anchor="start" class="subtitle">Hold the attack suite and response contract constant while controls change.</text><text x="60" y="184" text-anchor="start" class="legend">VISUAL KEY</text><rect x="177" y="169" width="13" height="13" rx="3" fill="#E8F2FA" stroke="#32658A"/><text x="199" y="182" class="legend">INPUT / EVIDENCE</text><polygon points="387,169 399,169 407,177 399,185 387,185 379,177" fill="#F0EBF9" stroke="#7455B5"/><text x="415" y="182" class="legend">MODEL</text><path d="M526 170 L538 174 V180 Q532 187 526 180 Z" fill="#EAF4EF" stroke="#2F7458"/><text x="546" y="182" class="legend">APPLICATION GUARD</text><rect x="733" y="169" width="13" height="13" rx="3" fill="#FFF2DD" stroke="#915600"/><text x="755" y="182" class="legend">REVIEW / UNKNOWN</text><rect x="949" y="169" width="13" height="13" rx="3" fill="#FBEAE7" stroke="#AC443F"/><text x="971" y="182" class="legend">ATTACK / ERROR</text><text x="1535" y="50" text-anchor="end" class="legend" fill="#58697F">04  /  06</text><rect x="52" y="218" width="1496" height="500" rx="18" fill="#FFFDF9" stroke="#132B47" stroke-width="2.5"/><path d="M70 218 H1530 Q1548 218 1548 236 V270 H52 V236 Q52 218 70 218" fill="#132B47"/><text x="76" y="251" text-anchor="start" class="frame-title">CONTROLLED ATTACK REPLAY</text><text x="1525" y="250" text-anchor="end" class="frame-note">47 IDENTICAL ATTACKS  •  TWO ARMS  •  ONE OUTPUT CONTRACT</text><rect x="307" y="292" width="626" height="132" rx="14" fill="#FFFDF9" stroke="#CFD6DC" stroke-width="1.8"/><rect x="307" y="487" width="680" height="144" rx="14" fill="#FFFDF9" stroke="#CFD6DC" stroke-width="1.8"/><path d="M238 442 H271 V356 H524" fill="none" stroke="#203C5D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M271 442 V558 H299" fill="none" stroke="#203C5D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M734 356 L865 356" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M465 558 L485 558" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M694 558 L715 558" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M924 558 H1040 V498 H1072" fill="none" stroke="#203C5D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M865 356 H1040 V394 H1072" fill="none" stroke="#203C5D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1260 445 L1282 445" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><rect x="68" y="363" width="170" height="158" rx="13" fill="#FBEAE7" stroke="#AC443F" stroke-width="2"/><g transform="translate(136.06 377.06) scale(0.77)" fill="none" stroke="#AC443F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 H29 L38 12 V41 H8 Z"/><path d="M29 3 V12 H38 M14 21 H31 M14 28 H31 M14 35 H27"/></g><text x="153.0" y="438" text-anchor="middle" class="node-title" fill="#172B45" style="font-size:19px;font-weight:700">47 ATTACKS</text><text x="153.0" y="481" text-anchor="middle" class="node-line" style="font-size:17px">shared runner</text><text x="153.0" y="504" text-anchor="middle" class="node-line" style="font-size:17px">same set · 2 arms</text><text x="330" y="321" text-anchor="start" class="micro" fill="#58697F" style="font-size:14px;font-weight:700;letter-spacing:1px">UNGUARDED</text><polygon points="547,313 719,313 734,368.0 719,423 547,423 532,368.0" fill="#F0EBF9" stroke="#7455B5" stroke-width="2.5"/><g transform="translate(548.48 353.48) scale(0.66)" fill="none" stroke="#7455B5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="11" width="22" height="22" rx="3"/><path d="M16 17 H28 M16 22 H28 M16 27 H24 M17 4 V10 M22 4 V10 M27 4 V10 M17 34 V40 M22 34 V40 M27 34 V40 M4 17 H10 M4 22 H10 M4 27 H10 M34 17 H40 M34 22 H40 M34 27 H40"/></g><text x="590" y="351" text-anchor="start" class="node-title" fill="#172B45" style="font-size:14px;font-weight:700">MODEL</text><text x="590" y="383" text-anchor="start" class="node-line" style="font-size:14px">same call</text><text x="330" y="516" text-anchor="start" class="micro" fill="#2F7458" style="font-size:14px;font-weight:700;letter-spacing:1px">GUARDED</text><rect x="307" y="530" width="158" height="105" rx="13" fill="#EAF4EF" stroke="#2F7458" stroke-width="2"/><g transform="translate(323.48 567.98) scale(0.66)" fill="none" stroke="#2F7458" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 L37 9 V20 C37 30 31 37 22 42 C13 37 7 30 7 20 V9 Z"/><path d="M14 22 L20 28 L31 16"/></g><text x="365" y="568" text-anchor="start" class="node-title" fill="#172B45" style="font-size:13px;font-weight:700">INPUT</text><text x="365" y="593" text-anchor="start" class="node-line" style="font-size:13px">GUARD</text><text x="365" y="612" text-anchor="start" class="node-line" style="font-size:13px">local block</text><polygon points="508,530 679,530 694,582.5 679,635 508,635 493,582.5" fill="#F0EBF9" stroke="#7455B5" stroke-width="2.5"/><g transform="translate(509.48 567.98) scale(0.66)" fill="none" stroke="#7455B5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="11" width="22" height="22" rx="3"/><path d="M16 17 H28 M16 22 H28 M16 27 H24 M17 4 V10 M22 4 V10 M27 4 V10 M17 34 V40 M22 34 V40 M27 34 V40 M4 17 H10 M4 22 H10 M4 27 H10 M34 17 H40 M34 22 H40 M34 27 H40"/></g><text x="551" y="568" text-anchor="start" class="node-title" fill="#172B45" style="font-size:14px;font-weight:700">MODEL</text><text x="551" y="600" text-anchor="start" class="node-line" style="font-size:14px">same call</text><rect x="723" y="530" width="201" height="105" rx="13" fill="#EAF4EF" stroke="#2F7458" stroke-width="2"/><g transform="translate(739.48 567.98) scale(0.66)" fill="none" stroke="#2F7458" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 L37 9 V20 C37 30 31 37 22 42 C13 37 7 30 7 20 V9 Z"/><path d="M14 22 L20 28 L31 16"/></g><text x="781" y="568" text-anchor="start" class="node-title" fill="#172B45" style="font-size:14px;font-weight:700">OUTPUT GUARD</text><text x="781" y="600" text-anchor="start" class="node-line" style="font-size:13px">inspect response</text><rect x="1080" y="335" width="180" height="220" rx="17" fill="#E8F2FA" stroke="#32658A" stroke-width="3"/><g transform="translate(1153.72 352.72) scale(0.74)" fill="none" stroke="#32658A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 H29 L38 12 V41 H8 Z"/><path d="M29 3 V12 H38 M14 21 H31 M14 28 H31 M14 35 H27"/></g><text x="1170" y="422" text-anchor="middle" class="node-title" fill="#32658A" style="font-size:24px;font-weight:700">SAME JSON</text><text x="1170" y="447" text-anchor="middle" class="node-title" fill="#32658A" style="font-size:24px;font-weight:700">CONTRACT</text><path d="M1104 466 H1236" stroke="#32658A" stroke-width="1.2" opacity=".5"/><text x="1170" y="486" text-anchor="middle" class="code" style="font-size:16px">is_safe:</text><text x="1170" y="510" text-anchor="middle" class="code" style="font-size:17px">&quot;yes&quot; | &quot;no&quot;</text><text x="1170" y="538" text-anchor="middle" class="code" style="font-size:16px">rationale: string</text><rect x="1290" y="267" width="235" height="388" rx="16" fill="#FFFDF9" stroke="#132B47" stroke-width="2.5"/><text x="1407" y="298" text-anchor="middle" class="micro" fill="#132B47" style="font-size:13px;font-weight:700;letter-spacing:.6px">7-OUTCOME CLASSIFIER</text><rect x="1306" y="313" width="203" height="37" rx="18.5" fill="#FFF2DD" stroke="#915600" stroke-width="1.5"/><text x="1407.5" y="337.5" text-anchor="middle" class="micro" fill="#915600" style="font-size:13px;font-weight:700;letter-spacing:0.35px">LOCAL BLOCK</text><rect x="1306" y="357" width="203" height="37" rx="18.5" fill="#F0EBF9" stroke="#7455B5" stroke-width="1.5"/><text x="1407.5" y="381.5" text-anchor="middle" class="micro" fill="#7455B5" style="font-size:13px;font-weight:700;letter-spacing:0.35px">MODEL REFUSAL</text><rect x="1306" y="401" width="203" height="37" rx="18.5" fill="#EAF4EF" stroke="#2F7458" stroke-width="1.5"/><text x="1407.5" y="425.5" text-anchor="middle" class="micro" fill="#2F7458" style="font-size:12px;font-weight:700;letter-spacing:0.35px">MODEL SAFE DECISION</text><rect x="1306" y="445" width="203" height="37" rx="18.5" fill="#FBEAE7" stroke="#AC443F" stroke-width="1.5"/><text x="1407.5" y="469.5" text-anchor="middle" class="micro" fill="#AC443F" style="font-size:11px;font-weight:700;letter-spacing:0.35px">MODEL UNSAFE DECISION</text><rect x="1306" y="489" width="203" height="37" rx="18.5" fill="#FBEAE7" stroke="#AC443F" stroke-width="1.5"/><text x="1407.5" y="513.5" text-anchor="middle" class="micro" fill="#AC443F" style="font-size:13px;font-weight:700;letter-spacing:0.35px">SCHEMA ERROR</text><rect x="1306" y="533" width="203" height="37" rx="18.5" fill="#FBEAE7" stroke="#AC443F" stroke-width="1.5"/><text x="1407.5" y="557.5" text-anchor="middle" class="micro" fill="#AC443F" style="font-size:13px;font-weight:700;letter-spacing:0.35px">TRANSPORT ERROR</text><rect x="1306" y="577" width="203" height="37" rx="18.5" fill="#FBEAE7" stroke="#AC443F" stroke-width="1.5"/><text x="1407.5" y="601.5" text-anchor="middle" class="micro" fill="#AC443F" style="font-size:13px;font-weight:700;letter-spacing:0.35px">INVALID JSON</text><rect x="323" y="660" width="1183" height="41" rx="11" fill="#FFF2DD" stroke="#915600" stroke-width="1.5"/><text x="914" y="686" text-anchor="middle" class="micro" fill="#915600" style="font-size:13px;font-weight:700;letter-spacing:.45px">MODEL_UNSAFE_DECISION IS A CLASSIFIER STATE — IT DOES NOT ALONE PROVE A SUCCESSFUL JAILBREAK.</text><path d="M60 758 H1540" stroke="#CBD2D8" stroke-width="1.5"/><text x="60" y="790" text-anchor="start" class="footer-kicker">WHAT TO NOTICE</text><text x="60" y="834" text-anchor="start" class="footer-title">A classifier state is not the same as an attack outcome.</text><text x="60" y="870" text-anchor="start" class="footer-note">Read the exact path that produced each row. An unsafe model decision needs separate evidence before calling it a jailbreak.</text></svg>
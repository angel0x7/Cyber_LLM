<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Lab 04: Guardrails &amp; Controlled Replay · LLM Security architecture</title><desc id="desc">The same 47 attacks enter a shared runner and split into unguarded and guarded conditions. The guarded arm adds an input guard and output guard. Both arms are interpreted through the same JSON contract, {is_safe, rationale}, then sorted into seven distinct outcomes: local block, model refusal, model safe decision, model unsafe decision, schema error, transport error, and invalid JSON. An unsafe model decision alone does not establish a successful jailbreak.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7" fill="none" stroke="#203C5D" stroke-width="1.5"/></marker><style>

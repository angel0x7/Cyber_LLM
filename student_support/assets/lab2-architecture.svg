<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Lab 02: Evaluation, Labels &amp; Metrics · LLM Security architecture</title><desc id="desc">Thirty code cases are evaluated twice, once with baseline instructions and once with secure instructions. Each arm produces result rows from the same model. Only after both runs do predictions join a separate provisional label store for grouped metrics. The labels never enter model prompts. Prediction, refusal, parse failure, and label disagreement remain distinguishable evidence.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7" fill="none" stroke="#203C5D" stroke-width="1.5"/></marker><style>

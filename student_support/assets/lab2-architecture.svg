"/></g><text x="353" y="332" text-anchor="start" class="node-title" fill="#172B45" style="font-size:13px;font-weight:700">BASELINE PROMPT</text><text x="353" y="364" text-anchor="start" class="node-line" style="font-size:12px">original wording</text><rect x="295" y="482" width="190" height="126" rx="13" fill="#E8F2FA" stroke="#32658A" stroke-width="2"/><g transform="translate(311.48 530.48) scale(0.66)" fill="none" stroke="#32658A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 H29 L38 12 V41 H8 Z"/><path d="M29 3 V12 H38 M14 21 H31 M14 28 H31 M14 35 H27"/></g><text x="353" y="520" text-anchor="start" class="node-title" fill="#172B45" style="font-size:14px;font-weight:700">SECURE PROMPT</text><text x="353" y="552" text-anchor="start" class="node-line" style="font-size:13px">reviewed policy</text><polygon points="550,294 700,294 715,357.0 700,420 550,420 535,357.0" fill="#F0EBF9" stroke="#7455B5" stroke-width="2.5"/><g transform="translate(551.48 342.48) scale(0.66)" fill="none" stroke="#7455B5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="11" width="22" height="22" rx="3"/><path d="M16 17 H28 M16 22 H28 M16 27 H24 M17 4 V10 M22 4 V10 M27 4 V10 M17 34 V40 M22 34 V40 M27 34 V40 M4 17 H10 M4 22 H10 M4 27 H10 M34 17 H40 M34 22 H40 M34 27 H40"/></g><text x="593" y="332" text-anchor="start" class="node-title" fill="#172B45" style="font-size:14px;font-weight:700">SAME MODEL</text><text x="593" y="364" text-anchor="start" class="node-line" style="font-size:14px">reviewer call</text><polygon points="550,482 700,482 715,545.0 700,608 550,608 535,545.0" fill="#F0EBF9" stroke="#7455B5" stroke-width="2.5"/><g transform="translate(551.48 530.48) scale(0.66)" fill="none" stroke="#7455B5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="11" width="22" height="22" rx="3"/><path d="M16 17 H28 M16 22 H28 M16 27 H24 M17 4 V10 M22 4 V10 M27 4 V10 M17 34 V40 M22 34 V40 M27 34 V40 M4 17 
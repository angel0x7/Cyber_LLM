M14 28 H31 M14 35 H27"/></g><text x="1158" y="455" text-anchor="middle" class="node-title" style="font-size:18px;font-weight:700">JOIN + REVIEW</text><text x="1158" y="483" text-anchor="middle" class="node-line" style="font-size:16px">prediction ↔ label</text><text x="1158" y="507" text-anchor="middle" class="node-line" style="font-size:16px">after both runs</text><rect x="1055" y="570" width="205" height="104" rx="13" fill="#FFF2DD" stroke="#915600" stroke-width="2"/><g transform="translate(1070.12 590.12) scale(0.54)" fill="none" stroke="#915600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 H29 L38 12 V41 H8 Z"/><path d="M29 3 V12 H38 M14 21 H31 M14 28 H31 M14 35 H27"/></g><text x="1104" y="606" text-anchor="start" class="node-title" fill="#172B45" style="font-size:14px;font-weight:700">PROVISIONAL LABEL</text><text x="1158" y="630" text-anchor="middle" class="node-line" style="font-size:12px">stored field:</text><text x="1158" y="649" text-anchor="middle" class="code" style="font-size:12px">PROVISIONAL_</text><text x="1158" y="665" text-anchor="middle" class="code" style="font-size:12px">GROUND_TRUTH</text><rect x="1310" y="372" width="205" height="166" rx="13" fill="#E8F2FA" stroke="#32658A" stroke-width="2"/><g transform="translate(1395.56 386.06) scale(0.77)" fill="none" stroke="#32658A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 H29 L38 12 V41 H8 Z"/><path d="M29 3 V12 H38 M14 21 H31 M14 28 H31 M14 35 H27"/></g><text x="1412.5" y="447" text-anchor="middle" class="node-title" fill="#172B45" style="font-size:18px;font-weight:700">GROUPED METRICS</text><text x="1412.5" y="498" text-anchor="middle" class="node-line" style="font-size:16px">coverage · quality</text><text x="1412.5" y="521" text-anchor="middle" class="node-line" style="font-size:16px">failures by prompt</text><rect x="84" y="640" width="165" height="39" rx="19.5" fill="#E8F2FA" stroke="#32658A" stroke-width="1.5"/><text x="166.5" y="665.5" text-anchor="middle" class="micro" fill="#172B45" style="font-size:14px;font-weight:700;letter-spacing:0.35px">PREDICTION</text><rect x="263" y="640" width="145" height="39" rx="19.5" fill="#F0EBF9" stroke="#7455B5" stroke-width="1.5"/><text x="335.5" y="665.5" text-anchor="middle" class="micro" fill="#7455B5" style="font-size:14px;font-weight:700;letter-spacing:0.35px">REFUSAL</text><rect x="422" y="640" width="183" height="39" rx="19.5" fill="#FBEAE7" stroke="#AC443F" stroke-width="1.5"/><text x="513.5" y="665.5" text-anchor="middle" class="micro" fill="#AC443F" style="font-size:14px;font-weight:700;letter-spacing:0.35px">PARSE FAILURE</text><text x="640" y="666" text-anchor="start" class="node-line" fill="#58697F" style="font-size:17px">Keep every row; metrics need the failures too.</text><text x="1055" y="348" text-anchor="start" class="micro" fill="#915600" style="font-size:13px;font-weight:700;letter-spacing:.7px">NO LABEL FLOWS TO THE MODEL</text><text x="1312" y="573" text-anchor="start" class="micro" fill="#32658A" style="font-size:14px;font-weight:700;letter-spacing:1px">COMPARE PROMPTS</text><path d="M60 758 H1540" stroke="#CBD2D8" stroke-width="1.5"/><text x="60" y="790" text-anchor="start" class="footer-kicker">WHAT TO NOTICE</text><text x="60" y="834" text-anchor="start" class="footer-title">Expected labels belong in the evaluator.</text><text x="60" y="870" text-anchor="start" class="footer-note">Compare coverage, quality, refusal, parse failure, and provisional label disagreement by prompt.</text></svg>
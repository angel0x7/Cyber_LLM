<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Lab 01: Prompt Safety &amp; Structured Outputs · LLM Security architecture</title><desc id="desc">An untrusted input enters the prompt policy and model flow. The model returns JSON, which a separate application schema check validates before a findings report is saved. Response states include valid JSON shape, refusal, invalid JSON, and schema error. A valid shape is not proof of a safe decision, and prompt text is not an enforceable application control.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7" fill="none" stroke="#203C5D" stroke-width="1.5"/></marker><style>
text { text-rendering: geometricPrecision; }
.kicker { font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: 2.4px; fill: #32658A; }
.title { font: 42px Georgia, 'Times New Roman', serif; fill: #172B45; }
.subtitle { font: 19px Arial, Helvetica, sans-serif; fill: #58697F; }
.legend { font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: .6px; fill: #43536A; }
.frame-title { font: 700 16px Arial, Helvetica, sans-serif; letter-spacing: 1.4px; fill: #FFFFFF; }
.frame-note { font: 15px Arial, Helvetica, sans-serif; fill: #D7E1ED; }
.node-title { font: 700 19px Arial, Helvetica, sans-serif; fill: #172B45; }
.node-line { font: 17px Arial, Helvetica, sans-serif; fill: #52647A; }
.node-line-small { font: 16px Arial, Helvetica, sans-serif; fill: #52647A; }
.micro { font: 700 14px Arial, Helvetica, sans-serif; letter-spacing: .8px; }
.body { font: 18px Arial, Helvetica, sans-serif; fill: #334960; }
.body-strong { font: 700 18px Arial, Helvetica, sans-serif; fill: #172B45; }
.code { font: 19px 'Courier New', monospace; fill: #213B59; }
.footer-kicker { font: 700 14px Arial, Helvetica, sans-serif; letter-spacing: 1.9px; fill: #32658A; }
.footer-title { font: 31px Georgia, 'Times New Roman', serif; fill: #172B45; }
.footer-note { font: 17px Arial, Helvetica, sans-serif; fill: #52647A; }
</style></defs><rect width="1600" height="900" fill="#F5F2EA"/><text x="60" y="48" text-anchor="start" class="kicker">LLM SECURITY  /  SYSTEM MAP</text><text x="60" y="105" text-anchor="start" class="title">Prompt Safety &amp; Structured Outputs</text><text x="60" y="143" text-anchor="start" class="subtitle">One path from untrusted input to an inspectable report.</text><text x="60" y="184" text-anchor="start" class="legend">VISUAL KEY</text><rect x="177" y="169" width="13" height="13" rx="3" fill="#E8F2FA" stroke="#32658A"/><text x="199" y="182" class="legend">INPUT / EVIDENCE</text><polygon points="387,169 399,169 407,177 399,185 387,185 379,177" fill="#F0EBF9" stroke="#7455B5"/><text x="415" y="182" class="legend">MODEL</text><path d="M526 170 L538 174 V180 Q532 187 526 180 Z" fill="#EAF4EF" stroke="#2F7458"/><text x="546" y="182" class="legend">APPLICATION GUARD</text><rect x="733" y="169" width="13" height="13" rx="3" fill="#FFF2DD" stroke="#915600"/><text x="755" y="182" class="legend">REVIEW / UNKNOWN</text><rect x="949" y="169" width="13" height="13" rx="3" fill="#FBEAE7" stroke="#AC443F"/><text x="971" y="182" class="legend">ATTACK / ERROR</text><text x="1535" y="50" text-anchor="end" class="legend" fill="#58697F">01  /  06</text><rect x="52" y="218" width="1496" height="500" rx="18" fill="#FFFDF9" stroke="#132B47" stroke-width="2.5"/><path d="M70 218 H1530 Q1548 218 1548 236 V270 H52 V236 Q52 218 70 218" fill="#132B47"/><text x="76" y="251" text-anchor="start" class="frame-title">REQUEST → RESPONSE → FINDING</text><text x="1525" y="250" text-anchor="end" class="frame-note">PROMPT GUIDES  •  VALIDATOR CHECKS SHAPE</text><path d="M251 435 L297 435" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M510 435 L549 435" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M767 435 L805 435" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M1009 435 L1047 435" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M1265 435 L1297 435" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><rect x="72" y="350" width="179" height="168" rx="13" fill="#E8F2FA" stroke="#32658A" stroke-width="2"/><g transform="translate(144.56 364.06) scale(0.77)" fill="none" stroke="#32658A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 H29 L38 12 V41 H8 Z"/><path d="M29 3 V12 H38 M14 21 H31 M14 28 H31 M14 35 H27"/></g><text x="161.5" y="425" text-anchor="middle" class="node-title" fill="#172B45" style="font-size:16px;font-weight:700">UNTRUSTED INPUT</text><text x="161.5" y="500" text-anchor="middle" class="node-line" style="font-size:17px">benign or attack</text><rect x="305" y="350" width="205" height="168" rx="13" fill="#E8F2FA" stroke="#32658A" stroke-width="2"/><g transform="translate(390.56 364.06) scale(0.77)" fill="none" stroke="#32658A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 H29 L38 12 V41 H8 Z"/><path d="M29 3 V12 H38 M14 21 H31 M14 28 H31 M14 35 H27"/></g><text x="407.5" y="425" text-anchor="middle" class="node-title" fill="#172B45" style="font-size:19px;font-weight:700">PROMPT POLICY</text><text x="407.5" y="478" text-anchor="middle" class="node-line" style="font-size:17px">instructions +</text><text x="407.5" y="501" text-anchor="middle" class="node-line" style="font-size:17px">template</text><polygon points="572,350 752,350 767,434.0 752,518 572,518 557,434.0" fill="#F0EBF9" stroke="#7455B5" stroke-width="2.5"/><g transform="translate(645.06 364.06) scale(0.77)" fill="none" stroke="#7455B5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="11" width="22" height="22" rx="3"/><path d="M16 17 H28 M16 22 H28 M16 27 H24 M17 4 V10 M22 4 V10 M27 4 V10 M17 34 V40 M22 34 V40 M27 34 V40 M4 17 H10 M4 22 H10 M4 27 H10 M34 17 H40 M34 22 H40 M34 27 H40"/></g><text x="662.0" y="425" text-anchor="middle" class="node-title" fill="#172B45" style="font-size:19px;font-weight:700">MODEL</text><text x="662.0" y="500" text-anchor="middle" class="node-line" style="font-size:17px">provider call</text><rect x="813" y="350" width="196" height="168" rx="13" fill="#E8F2FA" stroke="#32658A" stroke-width="2"/><g transform="translate(894.06 364.06) scale(0.77)" fill="none" stroke="#32658A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 H29 L38 12 V41 H8 Z"/><path d="M29 3 V12 H38 M14 21 H31 M14 28 H31 M14 35 H27"/></g><text x="911.0" y="425" text-anchor="middle" class="node-title" fill="#172B45" style="font-size:19px;font-weight:700">JSON RESPONSE</text><text x="911.0" y="478" text-anchor="middle" class="node-line" style="font-size:17px">finding or</text><text x="911.0" y="501" text-anchor="middle" class="node-line" style="font-size:17px">refusal</text><rect x="1055" y="350" width="210" height="168" rx="13" fill="#EAF4EF" stroke="#2F7458" stroke-width="2"/><g transform="translate(1143.06 364.06) scale(0.77)" fill="none" stroke="#2F7458" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 L37 9 V20 C37 30 31 37 22 42 C13 37 7 30 7 20 V9 Z"/><path d="M14 22 L20 28 L31 16"/></g><text x="1160.0" y="425" text-anchor="middle" class="node-title" fill="#172B45" style="font-size:19px;font-weight:700">SCHEMA CHECK</text><text x="1160.0" y="478" text-anchor="middle" class="node-line" style="font-size:17px">Pydantic shape</text><text x="1160.0" y="501" text-anchor="middle" class="node-line" style="font-size:17px">validation</text><rect x="1305" y="350" width="215" height="168" rx="13" fill="#E8F2FA" stroke="#32658A" stroke-width="2"/><g transform="translate(1395.56 364.06) scale(0.77)" fill="none" stroke="#32658A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 H29 L38 12 V41 H8 Z"/><path d="M29 3 V12 H38 M14 21 H31 M14 28 H31 M14 35 H27"/></g><text x="1412.5" y="425" text-anchor="middle" class="node-title" fill="#172B45" style="font-size:19px;font-weight:700">FINDINGS</text><text x="1412.5" y="478" text-anchor="middle" class="node-line" style="font-size:17px">JSON report</text><text x="1412.5" y="501" text-anchor="middle" class="node-line" style="font-size:17px">plus failures</text><path d="M1030 317 V557" stroke="#2F7458" stroke-width="2" stroke-dasharray="7 7"/><text x="1030" y="306" text-anchor="middle" class="micro" fill="#2F7458" style="font-size:13px;font-weight:700;letter-spacing:.8px">STRUCTURE CHECK</text><text x="80" y="579" text-anchor="start" class="micro" fill="#58697F" style="font-size:14px;font-weight:700;letter-spacing:1px">RESPONSE STATES</text><rect x="250" y="558" width="205" height="44" rx="22.0" fill="#EAF4EF" stroke="#2F7458" stroke-width="1.5"/><text x="352.5" y="586.0" text-anchor="middle" class="micro" fill="#2F7458" style="font-size:14px;font-weight:700;letter-spacing:0.35px">VALID JSON SHAPE</text><rect x="470" y="558" width="150" height="44" rx="22.0" fill="#F0EBF9" stroke="#7455B5" stroke-width="1.5"/><text x="545.0" y="586.0" text-anchor="middle" class="micro" fill="#7455B5" style="font-size:14px;font-weight:700;letter-spacing:0.35px">REFUSAL</text><rect x="635" y="558" width="190" height="44" rx="22.0" fill="#FBEAE7" stroke="#AC443F" stroke-width="1.5"/><text x="730.0" y="586.0" text-anchor="middle" class="micro" fill="#AC443F" style="font-size:14px;font-weight:700;letter-spacing:0.35px">INVALID JSON</text><rect x="840" y="558" width="185" height="44" rx="22.0" fill="#FBEAE7" stroke="#AC443F" stroke-width="1.5"/><text x="932.5" y="586.0" text-anchor="middle" class="micro" fill="#AC443F" style="font-size:14px;font-weight:700;letter-spacing:0.35px">SCHEMA ERROR</text><rect x="1050" y="551" width="450" height="60" rx="12" fill="#FFF2DD" stroke="#915600" stroke-width="1.5"/><text x="1275" y="576" text-anchor="middle" class="body-strong" fill="#915600" style="font-size:20px;font-weight:700">VALID SHAPE  ≠  SAFE ANSWER</text><text x="1275" y="598" text-anchor="middle" class="node-line" style="font-size:16px">Inspect the finding and its evidence.</text><text x="80" y="675" text-anchor="start" class="micro" fill="#132B47" style="font-size:14px;font-weight:700;letter-spacing:1px">THE APPLICATION OWNS THE STRUCTURAL CHECK. PROMPT WORDS DO NOT CREATE THAT CONTROL.</text><path d="M60 758 H1540" stroke="#CBD2D8" stroke-width="1.5"/><text x="60" y="790" text-anchor="start" class="footer-kicker">WHAT TO NOTICE</text><text x="60" y="834" text-anchor="start" class="footer-title">A valid shape can still carry an unsafe finding.</text><text x="60" y="870" text-anchor="start" class="footer-note">Read the response and the evidence after the schema check; keep refusals and errors visible.</text></svg>
;font-weight:700">FINDINGS</text><text x="620.0" y="450" text-anchor="middle" class="node-line" style="font-size:17px">rule + source</text><text x="620.0" y="473" text-anchor="middle" class="node-line" style="font-size:17px">line</text><polygon points="767,330 937,330 952,410.0 937,490 767,490 752,410.0" fill="#F0EBF9" stroke="#7455B5" stroke-width="2.5"/><g transform="translate(835.06 344.06) scale(0.77)" fill="none" stroke="#7455B5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="11" width="22" height="22" rx="3"/><path d="M16 17 H28 M16 22 H28 M16 27 H24 M17 4 V10 M22 4 V10 M27 4 V10 M17 34 V40 M22 34 V40 M27 34 V40 M4 17 H10 M4 22 H10 M4 27 H10 M34 17 H40 M34 22 H40 M34 27 H40"/></g><text x="852.0" y="405" text-anchor="middle" class="node-title" fill="#172B45" style="font-size:18px;font-weight:700">LLM PROPOSAL</text><text x="852.0" y="450" text-anchor="middle" class="node-line" style="font-size:17px">optional repair</text><text x="852.0" y="473" text-anchor="middle" class="node-line" style="font-size:17px">suggestion</text><rect x="1002" y="330" width="190" height="160" rx="13" fill="#FFF2DD" stroke="#915600" stroke-width="2"/><g transform="translate(1080.06 344.06) scale(0.77)" fill="none" stroke="#915600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 L37 9 V20 C37 30 31 37 22 42 C13 37 7 30 7 20 V9 Z"/><path d="M14 22 L20 28 L31 16"/></g><text x="1097.0" y="405" text-anchor="middle" class="node-title" fill="#172B45" style="font-size:18px;font-weight:700">HUMAN REVIEW</text><text x="1097.0" y="450" text-anchor="middle" class="node-line" style="font-size:17px">accept, edit,</text><text x="1097.0" y="473" text-anchor="middle" class="node-line" style="font-size:17px">or reject</text><rect x="1260" y="330" width="240" height="160" rx="13" fill="#E8F2FA" stroke="#32658A" stroke-width="2"/><g transform="translate(1363.06 344.06) scale(0.77)" fill="none" stroke="#32658A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M28 6 A13 13 0 0 0 14 22 L5 31 A5 5 0 0 0 12 38 L21 29 A13 13 0 0 0 37 15 L29 22 L22 20 L20 13 Z"/></g><text x="1380.0" y="405" text-anchor="middle" class="node-title" fill="#172B45" style="font-size:19px;font-weight:700">RESCAN</text><text x="1380.0" y="450" text-anchor="middle" class="node-line" style="font-size:17px">before / after</text><text x="1380.0" y="473" text-anchor="middle" class="node-line" style="font-size:17px">scanner evidence</text><text x="87" y="557" text-anchor="start" class="micro" fill="#58697F" style="font-size:14px;font-weight:700;letter-spacing:1px">EVIDENCE SEQUENCE</text><rect x="272" y="550" width="220" height="112" rx="13" fill="#E8F2FA" stroke="#32658A" stroke-width="2"/><g transform="translate(288.48 591.48) scale(0.66)" fill="none" stroke="#32658A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 H29 L38 12 V41 H8 Z"/><path d="M29 3 V12 H38 M14 21 H31 M14 28 H31 M14 35 H27"/></g><text x="330" y="588" text-anchor="start" class="node-title" fill="#172B45" style="font-size:16px;font-weight:700">BEFORE</text><text x="330" y="620" text-anchor="start" class="node-line" style="font-size:14px">scanner finding</text><rect x="650" y="550" width="250" height="112" rx="13" fill="#FFF2DD" stroke="#915600" stroke-width="2"/><g transform="translate(666.48 591.48) scale(0.66)" fill="none" stroke="#915600" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 L37 9 V20 C37 30 31 37 22 42 C13 37 7 30 7 20 V9 Z"/><path d="M14 22 L20 28 L31 16"/></g><text x="708" y="588" text-anchor="start" class="node-title" fill="#172B45" style="font-size:16px;font-weight:700">REVIEWED FIX</text><text x="708" y="620" text-anchor="start" class="node-line" style="font-size:14px">manual change</text><rect x="1068" y="550" width="260" height="112" rx="13" fill="#E8F2FA" stroke="#32658A" stroke-width="2"/><g transform="translate(1084.48 591.48) scale(0.66)" fill="none" stroke="#32658A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 H29 L38 12 V41 H8 Z"/><path d="M29 3 V12 H38 M14 21 H31 M14 28 H31 M14 35 H27"/></g><text x="1126" y="588" text-anchor="start" class="node-title" fill="#172B45" style="font-size:16px;font-weight:700">AFTER</text><text x="1126" y="620" text-anchor="start" class="node-line" style="font-size:14px">rescan result</text><path d="M492 607 L650 607" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M900 607 L1068 607" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M1410 490 V520 H385 V493" fill="none" stroke="#203C5D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="911" y="538" text-anchor="middle" class="micro" fill="#132B47" style="font-size:13px;font-weight:700;letter-spacing:.5px">ONLY A HUMAN-APPROVED MANUAL CHANGE RETURNS TO THE SCANNER</text><rect x="752" y="278" width="200" height="35" rx="10" fill="#FFF2DD" stroke="#915600" stroke-width="1.5"/><text x="852" y="301" text-anchor="middle" class="micro" fill="#915600" style="font-size:13px;font-weight:700;letter-spacing:.3px">LLM ADVICE — UNTRUSTED</text><rect x="65" y="676" width="640" height="25" rx="5" fill="#E8F2FA"/><text x="385" y="694" text-anchor="middle" class="micro" fill="#32658A" style="font-size:13px;font-weight:700;letter-spacing:.5px">SCANNER EVIDENCE  •  reproducible rule, location, before / after</text><rect x="752" y="676" width="748" height="25" rx="5" fill="#FFF2DD"/><text x="1126" y="694" text-anchor="middle" class="micro" fill="#915600" style="font-size:13px;font-weight:700;letter-spacing:.5px">LLM ADVICE  •  inspect it; the tool never edits the repository</text><path d="M60 758 H1540" stroke="#CBD2D8" stroke-width="1.5"/><text x="60" y="790" text-anchor="start" class="footer-kicker">WHAT TO NOTICE</text><text x="60" y="834" text-anchor="start" class="footer-title">The model proposes; a person decides.</text><text x="60" y="870" text-anchor="start" class="footer-note">A scanner finding is evidence to investigate. The rescan shows whether the reviewed change altered it.</text></svg>
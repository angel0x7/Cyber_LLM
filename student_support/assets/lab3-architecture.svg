<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Lab 03: Security Scanning &amp; Remediation · LLM Security architecture</title><desc id="desc">A local repository is inspected by Checkov and Semgrep. Their findings identify rules and source locations. An optional language model can propose a repair, but that advice is untrusted and never edits files. A person accepts, edits, or rejects the proposal; only a manually reviewed change proceeds to rescan. Compare scanner evidence before and after.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7" fill="none" stroke="#203C5D" stroke-width="1.5"/></marker><style>

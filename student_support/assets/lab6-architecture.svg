<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Lab 06: Cross-Model Benchmark · LLM Security architecture</title><desc id="desc">The same 20 frozen scenarios in the same two application modes form 40 condition slots per model. Four parallel model lanes feed one unchanged evaluator: DeepSeek V4.1 Flash, GLM 5.3, Kimi K3, and MiMo V2.5 Pro. Compare security, utility, reliability, latency, and cost separately. Unknown cost, transport failures, missing reasoning, and retries remain visible; no single universal winner is implied.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7" fill="none" stroke="#203C5D" stroke-width="1.5"/></marker><style>

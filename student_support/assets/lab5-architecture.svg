.footer-title { font: 31px Georgia, 'Times New Roman', serif; fill: #172B45; }
.footer-note { font: 17px Arial, Helvetica, sans-serif; fill: #52647A; }
</style></defs><rect width="1600" height="900" fill="#F5F2EA"/><text x="60" y="48" text-anchor="start" class="kicker">LLM SECURITY  /  SYSTEM MAP</text><text x="60" y="105" text-anchor="start" class="title">OWASP GenAI Red Team Arena</text><text x="60" y="143" text-anchor="start" class="subtitle">Same scenario set. Same model. The application controls change.</text><text x="60" y="184" text-anchor="start" class="legend">VISUAL KEY</text><rect x="177" y="169" width="13" height="13" rx="3" fill="#E8F2FA" stroke="#32658A"/><text x="199" y="182" class="legend">INPUT / EVIDENCE</text><polygon points="387,169 399,169 407,177 399,185 387,185 379,177" fill="#F0EBF9" stroke="#7455B5"/><text x="415" y="182" class="legend">MODEL</text><path d="M526 170 L538 174 V180 Q532 187 526 180 Z" fill="#EAF4EF" stroke="#2F7458"/><text x="546" y="182" class="legend">APPLICATION GUARD</text><rect x="733" y="169" width="13" height="13" rx="3" fill="#FFF2DD" stroke="#915600"/><text x="755" y="182" class="legend">REVIEW / UNKNOWN</text><rect x="949" y="169" width="13" height="13" rx="3" fill="#FBEAE7" stroke="#AC443F"/><text x="971" y="182" class="legend">ATTACK / ERROR</text><text x="1535" y="50" text-anchor="end" class="legend" fill="#58697F">05  /  06</text><rect x="52" y="218" width="1496" height="500" rx="18" fill="#FFFDF9" stroke="#132B47" stroke-width="2.5"/><path d="M70 218 H1530 Q1548 218 1548 236 V270 H52 V236 Q52 218 70 218" fill="#132B47"/><text x="76" y="251" text-anchor="start" class="frame-title">APPLICATION DEFENSE AROUND ONE MODEL</text><text x="1525" y="250" text-anchor="end" class="frame-note">SAME 20 SCENARIOS  •  SAME MODEL MESSAGES  •  TWO CONTROL MODES</text><rect x="70" y="277" width="236" height="373" rx="15" fill="#FFFDF9" stroke="#32658A" stroke-width="2.2"/><text x="188" y="307" text-anchor="middle" class="micro" fill="#32658A" style="font-size:14px;font-weight:700;letter-spacing:1px">20 SCENARIOS</text><text x="96" y="346" text-anchor="start" class="micro" fill="#58697F" style="font-size:11px;font-weight:700;letter-spacing:.4px">FAMILY</text><text x="198" y="346" text-anchor="middle" class="micro" fill="#58697F" style="font-size:11px;font-weight:700;letter-spacing:.3px">ATTACK</text><text x="260" y="346" text-anchor="middle" class="micro" fill="#58697F" style="font-size:11px;font-weight:700;letter-spacing:.3px">BENIGN</text><path d="M88 359 H288 M88 416 H288 M88 473 H288 M88 530 H288 M88 587 H288 M169 359 V587 M230 359 V587" stroke="#CFD6DC" stroke-width="1.2"/><text x="96" y="394" text-anchor="start" class="body-strong" style="font-size:17px">LLM01</text><text x="198" y="394" text-anchor="middle" class="body" style="font-size:17px">4</text><text x="260" y="394" text-anchor="middle" class="body" style="font-size:17px">1</text><text x="96" y="451" text-anchor="start" class="body-strong" style="font-size:17px">LLM02</text><text x="198" y="451" text-anchor="middle" class="body" style="font-size:17px">4</text><text x="260" y="451" text-anchor="middle" class="body" style="font-size:17px">1</text><text x="96" y="508" text-anchor="start" class="body-strong" style="font-size:17px">LLM05</text><text x="198" y="508" text-anchor="middle" class="body" style="font-size:17px">4</text><text x="260" y="508" text-anchor="middle" class="body" style="font-size:17px">1</text><text x="96" y="565" text-anchor="start" class="body-strong" style="font-size:17px">LLM06</text><text x="198" y="565" text-anchor="middle" class="body" style="font-size:17px">4</text><text x="260" y="565" text-anchor="middle" class="body" style="font-size:17px">1</text><text x="188" y="625" text-anchor="middle" class="micro" fill="#32658A" style="font-size:13px;font-weight:700;letter-spacing:.5px">16 ATTACKS  +  4 BENIGN</text><rect x="354" y="292" width="1144" height="166" rx="14" fill="#FFFDF9" stroke="#CFD6DC" stroke-width="1.8"/><rect x="354" y="482" width="1144" height="167" rx="14" fill="#FFFDF9" stroke="#2F7458" stroke-width="2"/><path d="M306 465 H329 V385 H346" fill="none" stroke="#203C5D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M329 465 V570 H346" fill="none" stroke="#203C5D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M354 385 L620 385" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M858 385 L899 385" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M1102 385 L1166 385" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M528 570 L543 570" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M776 570 L780 570" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M989 570 L1005 570" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><path d="M1202 570 L1218 570" fill="none" stroke="#203C5D" stroke-width="3" marker-end="url(#arrow)"/><text x="375" y="320" text-anchor="start" class="micro" fill="#AC443F" style="font-size:14px;font-weight:700;letter-spacing:1px">VULNERABLE APP MODE</text><text x="1478" y="320" text-anchor="end" class="micro" fill="#58697F" style="font-size:12px;font-weight:700;letter-spacing:.4px">NO DETERMINISTIC GUARDS</text><polygon points="643,333 843,333 858,385.0 843,437 643,437 628,385.0" fill="#F0EBF9" stroke="#7455B5" stroke-width="2.5"/><g transform="translate(644.48 370.48) scale(0.66)" fill="none" stroke="#7455B5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="11" width="22" height="22" rx="3"/><path d="M16 17 H28 M16 22 H28 M16 27 H24 M17 4 V10 M22 4 V10 M27 4 V10 M17 34 V40 M22 34 V40 M27 34 V40 M4 17 H10 M4 22 H10 M4 27 H10 M34 17 H40 M34 22 H40 M34 27 H40"/></g><text x="686" y="371" text-anchor="start" class="node-title" fill="#172B45" style="font-size:16px;font-weight:700">MODEL</text><text x="686" y="403" text-anchor="start" class="node-line" style="font-size:14px">DeepSeek V4.1 Flash</text><rect x="907" y="333" width="195" height="104" rx="13" fill="#E8F2FA" stroke="#32658A" stroke-width="2"/><g transform="translate(923.48 370.48) scale(0.66)" fill="none" stroke="#32658A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 H29 L38 12 V41 H8 Z"/><path d="M29 3 V12 H38 M14 21 H31 M14 28 H31 M14 35 H27"/></g><text x="965" y="371" text-anchor="start" class="node-title" fill="#172B45" style="font-size:14px;font-weight:700">RESPONSE</text><text x="965" y="396" text-anchor="start" class="node-line" style="font-size:13px">model refusal or</text><text x="965" y="415" text-anchor="start" class="node-line" style="font-size:13px">answer</text><rect x="1174" y="333" width="250" height="104" rx="13" fill="#E8F2FA" stroke="#32658A" stroke-width="2"/><g transform="translate(1190.48 370.48) scale(0.66)" fill="none" stroke="#32658A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M28 6 A13 13 0 0 0 14 22 L5 31 A5 5 0 0 0 12 38 L21 29 A13 13 0 0 0 37 15 L29 22 L22 20 L20 13 Z"/></g><text x="1232" y="371" text-anchor="start" class="node-title" fill="#172B45" style="font-size:16px;font-weight:700">VIRTUAL ACTION</text><text x="1232" y="396" text-anchor="start" class="node-line" style="font-size:13px">simulated receipt</text><text x="1232" y="415" text-anchor="start" class="node-line" style="font-size:13px">no outside operation</text><text x="375" y="510" text-anchor="start" class="micro" fill="#2F7458" style="font-size:14px;font-weight:700;letter-spacing:1px">HARDENED APP MODE</text><text x="1478" y="510" text-anchor="end" class="micro" fill="#58697F" style="font-size:12px;font-weight:700;letter-spacing:.4px">SAME MODEL + SAME MESSAGES</text><rect x="354" y="528" width="174" height="106" rx="13" fill="#EAF4EF" stroke="#2F7458" stroke-width="2"/><g transform="translate(370.48 566.48) scale(0.66)" fill="none" stroke="#2F7458" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 L37 9 V20 C37 30 31 37 22 42 C13 37 7 30 7 20 V9 Z"/><path d="M14 22 L20 28 L31 16"/></g><text x="412" y="566" text-anchor="start" class="node-title" fill="#172B45" style="font-size:13px;font-weight:700">INPUT GUARD</text><text x="412" y="598" text-anchor="start" class="node-line" style="font-size:12px">pre-call block</text><polygon points="566,528 761,528 776,581.0 761,634 566,634 551,581.0" fill="#F0EBF9" stroke="#7455B5" stroke-width="2.5"/><g transform="translate(567.48 566.48) scale(0.66)" fill="none" stroke="#7455B5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="11" width="22" height="22" rx="3"/><path d="M16 17 H28 M16 22 H28 M16 27 H24 M17 4 V10 M22 4 V10 M27 4 V10 M17 34 V40 M22 34 V40 M27 34 V40 M4 17 H10 M4 22 H10 M4 27 H10 M34 17 H40 M34 22 H40 M34 27 H40"/></g><text x="609" y="566" text-anchor="start" class="node-title" fill="#172B45" style="font-size:16px;font-weight:700">MODEL</text><text x="609" y="598" text-anchor="start" class="node-line" style="font-size:13px">DeepSeek V4.1 Flash</text><rect x="788" y="528" width="201" height="106" rx="13" fill="#EAF4EF" stroke="#2F7458" stroke-width="2"/><g transform="translate(804.48 566.48) scale(0.66)" fill="none" stroke="#2F7458" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 L37 9 V20 C37 30 31 37 22 42 C13 37 7 30 7 20 V9 Z"/><path d="M14 22 L20 28 L31 16"/></g><text x="846" y="566" text-anchor="start" class="node-title" fill="#172B45" style="font-size:14px;font-weight:700">OUTPUT GUARD</text><text x="846" y="598" text-anchor="start" class="node-line" style="font-size:13px">check response</text><rect x="1013" y="528" width="189" height="106" rx="13" fill="#EAF4EF" stroke="#2F7458" stroke-width="2"/><g transform="translate(1029.48 566.48) scale(0.66)" fill="none" stroke="#2F7458" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 L37 9 V20 C37 30 31 37 22 42 C13 37 7 30 7 20 V9 Z"/><path d="M14 22 L20 28 L31 16"/></g><text x="1071" y="566" text-anchor="start" class="node-title" fill="#172B45" style="font-size:14px;font-weight:700">TOOL POLICY</text><text x="1071" y="598" text-anchor="start" class="node-line" style="font-size:13px">allow-list</text><rect x="1226" y="528" width="242" height="106" rx="13" fill="#E8F2FA" stroke="#32658A" stroke-width="2"/><g transform="translate(1242.48 566.48) scale(0.66)" fill="none" stroke="#32658A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M28 6 A13 13 0 0 0 14 22 L5 31 A5 5 0 0 0 12 38 L21 29 A13 13 0 0 0 37 15 L29 22 L22 20 L20 13 Z"/></g><text x="1284" y="566" text-anchor="start" class="node-title" fill="#172B45" style="font-size:16px;font-weight:700">VIRTUAL TOOL</text><text x="1284" y="598" text-anchor="start" class="node-line" style="font-size:14px">receipt only</text><rect x="610" y="270" width="542" height="33" rx="10" fill="#F0EBF9" stroke="#7455B5" stroke-width="1.4"/><text x="881" y="292" text-anchor="middle" class="micro" fill="#7455B5" style="font-size:13px;font-weight:700;letter-spacing:.5px">THE TWO MODES SEND THE SAME MODEL MESSAGES</text><rect x="371" y="663" width="230" height="36" rx="18.0" fill="#F0EBF9" stroke="#7455B5" stroke-width="1.5"/><text x="486.0" y="687.0" text-anchor="middle" class="micro" fill="#7455B5" style="font-size:13px;font-weight:700;letter-spacing:0.35px">MODEL REFUSAL</text><rect x="621" y="663" width="210" height="36" rx="18.0" fill="#E8F2FA" stroke="#32658A" stroke-width="1.5"/><text x="726.0" y="687.0" text-anchor="middle" class="micro" fill="#172B45" style="font-size:12px;font-weight:700;letter-spacing:0.35px">APPLICATION BLOCK</text><rect x="851" y="663" width="270" height="36" rx="18.0" fill="#FFF2DD" stroke="#915600" stroke-width="1.5"/><text x="986.0" y="687.0" text-anchor="middle" class="micro" fill="#915600" style="font-size:12px;font-weight:700;letter-spacing:0.35px">VIRTUAL ACTION RECEIPT</text><text x="1150" y="686" text-anchor="start" class="node-line" fill="#58697F" style="font-size:15px">A refusal is model behavior; a block is app behavior.</text><path d="M60 758 H1540" stroke="#CBD2D8" stroke-width="1.5"/><text x="60" y="790" text-anchor="start" class="footer-kicker">WHAT TO NOTICE</text><text x="60" y="834" text-anchor="start" class="footer-title">Trace which layer acted.</text><text x="60" y="870" text-anchor="start" class="footer-note">The model can refuse. The application can block. A virtual tool receipt never represents an external action.</text></svg>
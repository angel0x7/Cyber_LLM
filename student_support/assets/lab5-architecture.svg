.subtitle { font: 19px Arial, Helvetica, sans-serif; fill: #58697F; }
.legend { font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: .6px; fill: #43536A; }
.frame-title { font: 700 16px Arial, Helvetica, sans-serif; letter-spacing: 1.4px; fill: #FFFFFF; }
.frame-note { font: 15px Arial, Helvetica, sans-serif; fill: #D7E1ED; }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Lab 05: OWASP GenAI Red Team Arena · LLM Security architecture</title><desc id="desc">Twenty fixed scenarios contain four OWASP families, each with four attacks and one benign control. They are replayed in vulnerable and hardened application modes with the same DeepSeek V4.1 Flash model messages. The hardened mode adds deterministic input, output, and tool controls. A model refusal is distinct from an application block. Tool actions produce virtual receipts only; nothing operates outside the lab.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7" fill="none" stroke="#203C5D" stroke-width="1.5"/></marker><style>
